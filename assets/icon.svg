<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Veranda app icon: a glass tile with a porch roof over a small server stack. Hand-built vector. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2550"/>
      <stop offset="1" stop-color="#2c1f62"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d7dff"/>
      <stop offset="1" stop-color="#9d5bff"/>
    </linearGradient>
    <linearGradient id="wall" gradientUnits="userSpaceOnUse" x1="312" y1="470" x2="312" y2="650">
      <stop offset="0" stop-color="#2d7dff"/>
      <stop offset="1" stop-color="#1f5fe0"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#676c9a"/>
      <stop offset="1" stop-color="#474b78"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect x="24" y="24" width="976" height="976" rx="224"/></clipPath>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="224" fill="url(#tile)"/>
  <path clip-path="url(#clip)" d="M24 24h700L24 790z" fill="url(#gloss)"/>
  <rect x="29" y="29" width="966" height="966" rx="219" fill="none" stroke="#a9a6e6" stroke-opacity="0.5" stroke-width="10"/>
  <!-- left wall + roof -->
  <path d="M312 650V470" stroke="url(#wall)" stroke-width="112" stroke-linecap="round" fill="none"/>
  <path d="M312 470 512 322l200 148" stroke="url(#roof)" stroke-width="112" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- server rails -->
  <rect x="470" y="498" width="322" height="72" rx="36" fill="url(#rail)"/>
  <rect x="470" y="590" width="322" height="72" rx="36" fill="url(#rail)"/>
  <rect x="470" y="682" width="322" height="72" rx="36" fill="url(#rail)"/>
  <circle cx="748" cy="534" r="17" fill="#38c6ff"/>
  <circle cx="748" cy="626" r="17" fill="#a78bfa"/>
  <circle cx="748" cy="718" r="17" fill="#f472b6"/>
</svg>
